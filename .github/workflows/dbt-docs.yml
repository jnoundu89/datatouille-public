# =============================================================================
# GitHub Pages - dbt Documentation Deployer
# =============================================================================
# Automatically compiles and deploys the dbt project documentation to GitHub Pages
# on every push to the main branch. Uses a PostgreSQL service container to generate
# a complete catalog.json metadata index.

name: Deploy dbt Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'dbt/**'
      - '.github/workflows/dbt-docs.yml'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        ports:
          - 5432:5432
        # Wait until postgres is healthy
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres

      - name: Configure dbt profiles
        run: |
          mkdir -p ~/.dbt
          cp dbt/profiles.yml ~/.dbt/profiles.yml

      - name: Generate dbt Documentation
        working-directory: dbt
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: airflow
        run: |
          dbt deps
          dbt compile
          # Build index.html, manifest.json and catalog.json
          dbt docs generate

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the compiled static target directory
          path: 'dbt/target/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
