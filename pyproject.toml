# =============================================================================
# Datatouille - Airflow 3.1.6 Enterprise Data Ingestion Platform
# =============================================================================

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datatouille"
version = "2.1.0"
description = "Airflow 3.1.6 Enterprise Data Ingestion Platform with CeleryExecutor"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.1.6",
    "apache-airflow-providers-amazon>=9.0.0",
    "apache-airflow-providers-celery>=3.8.0",
    "apache-airflow-providers-postgres>=5.13.0",
    "apache-airflow-providers-redis>=3.8.0",
    "boto3>=1.35.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "pydantic>=2.10.0",
    "scrapling[fetchers]>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "boto3-stubs>=1.35.0",
    "types-requests>=2.32.0",
    "pre-commit>=4.0.0",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.7.0",
]
dbt = [
    "dbt-core>=1.9.0",
    "dbt-postgres>=1.9.0",
    "dbt-duckdb>=1.9.0",
    "duckdb>=1.1.0",
]
soda = [
    "soda-core-postgres>=3.3.0",
]
iceberg = [
    # POC only — see scripts/iceberg_poc.py and docs/duckdb-pipeline.md.
    # Not a core dep: activate with `uv pip install -e '.[iceberg]'`.
    "pyiceberg[pyarrow,sql-sqlite,s3fs]>=0.8.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
]
all = [
    "datatouille[dev,dbt,soda,api]",
]

# No Python packages to distribute - this project is a data platform, not a library.
# This prevents setuptools from auto-discovering dags/, sql/, etc. as packages.
[tool.setuptools]
packages = []

# =============================================================================
# Ruff Configuration
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 120
src = ["dags", "scripts", "tests", "api"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "AIR",  # Airflow rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["dags", "scripts", "api"]

# =============================================================================
# MyPy Configuration
# =============================================================================
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_error_summary = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dags"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not integration'"
markers = [
    "integration: requires live MinIO/PostgreSQL services (deselected by default)",
]

# =============================================================================
# Bandit Configuration
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert used in tests
