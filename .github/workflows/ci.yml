# =============================================================================
# CI Pipeline - Airflow Data Platform
# =============================================================================
# Runs on push and pull requests to main/develop branches
# Stages: lint, test, validate-dags, security-scan

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ===========================================================================
  # Lint - Code Quality Checks
  # ===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests boto3-stubs pydantic

      - name: Run Ruff linter
        run: ruff check dags/ scripts/ tests/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check dags/ scripts/ tests/

      - name: Run MyPy type checker
        run: mypy dags/ scripts/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ===========================================================================
  # Test - Unit & Integration Tests
  # ===========================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No silent fallback: if the dev extras don't install, we want CI to
          # fail loudly instead of running tests with a minimal shim that makes
          # 100+ bs4-dependent tests fail spuriously.
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          PYTHONPATH: dags
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
          AIRFLOW_HOME: ${{ github.workspace }}/tests
        run: |
          pytest tests/ -v --tb=short --cov=dags --cov=scripts --cov-report=term-missing --cov-fail-under=15

  # ===========================================================================
  # Validate DAGs - Airflow 3.x Compliance
  # ===========================================================================
  validate-dags:
    name: Validate DAGs
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Airflow and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . ruff

      - name: Check for deprecated Airflow patterns
        run: |
          echo "Checking for deprecated Airflow 2.x patterns..."
          ruff check dags/ --select AIR30,AIR302 --preview --output-format=github

      - name: Validate DAG imports
        env:
          PYTHONPATH: dags
        run: |
          echo "Validating DAG imports..."
          python -c "
          from airflow.models import DagBag
          import os
          os.environ['AIRFLOW__CORE__LOAD_EXAMPLES'] = 'false'
          bag = DagBag('dags', include_examples=False)
          if bag.import_errors:
              for dag_id, error in bag.import_errors.items():
                  print(f'::error file=dags/{dag_id}::Import error: {error}')
              exit(1)
          print(f'Successfully loaded {len(bag.dags)} DAGs')
          "

  # ===========================================================================
  # Security Scan - Vulnerability Detection
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets

      - name: Run Bandit security scanner
        run: |
          bandit -r dags/ scripts/ -ll --format json --output bandit-results.json --exit-zero

      - name: Check for hardcoded secrets
        run: |
          detect-secrets scan dags/ scripts/ --baseline .secrets.baseline

  # ===========================================================================
  # Grafana - Dashboard JSON validation
  # ===========================================================================
  grafana-lint:
    name: Grafana Dashboards
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate dashboard JSON (UID uniqueness, schema, datasource refs)
        run: python scripts/validate_grafana_dashboards.py

      - name: Static panel SQL sanity check
        run: python scripts/lint_grafana_panel_sql.py

  # ===========================================================================
  # dbt - Model Validation
  # ===========================================================================
  dbt-check:
    name: dbt Validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-postgres

      - name: Validate dbt project
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

  # ===========================================================================
  # Dependency Audit - Vulnerability Detection in Dependencies
  # ===========================================================================
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,dbt]" pip-audit

      - name: Run pip-audit
        run: pip-audit --desc
        continue-on-error: true

  # ===========================================================================
  # Pre-commit - Full Hook Validation
  # ===========================================================================
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        continue-on-error: true
