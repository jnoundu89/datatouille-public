# =============================================================================
# dbt Packages - Dependencies
# =============================================================================
packages:
  # dbt-utils: Essential utility macros
  - package: dbt-labs/dbt_utils
    version: ">=1.0.0"

  # dbt-expectations: Great Expectations-like tests for dbt
  - package: calogica/dbt_expectations
    version: ">=0.10.0"

  # dbt-date: Date dimension and utilities
