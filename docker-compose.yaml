# =============================================================================
# Airflow 3.1.6 Enterprise Data Platform
# =============================================================================
# Full-featured stack with:
# - CeleryExecutor for distributed task execution
# - Redis as message broker
# - Prometheus + Grafana for observability
# - MinIO for S3-compatible object storage
# - PostgreSQL for metadata
# =============================================================================

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: ${AIRFLOW_IMAGE_NAME:-airflow-datatouille:3.1.6}
  environment:
    &airflow-common-env
    # ==========================================================================
    # Executor Configuration - CeleryExecutor for scalability
    # ==========================================================================
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CELERY__BROKER_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

    # Auth Manager - FAB required for Web UI
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    # Database
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: 'true'
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: 1800

    # Core settings
    # SECURITY: FERNET_KEY is REQUIRED for encrypting sensitive data
    # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    # Task Execution API - CRITICAL for Airflow 3.x task communication
    # Note: Internal port remains 8080, only external mapping changed to 9091
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/

    # JWT Secret - CRITICAL for authentication in Airflow 3.x
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-your-super-secret-jwt-key-change-me}

    # Scheduler settings
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: 5

    # ==========================================================================
    # Metrics - Prometheus via StatsD
    # ==========================================================================
    AIRFLOW__METRICS__STATSD_ON: 'true'
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 9125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow

    # ==========================================================================
    # Celery Worker Configuration
    # ==========================================================================
    AIRFLOW__CELERY__WORKER_CONCURRENCY: 4
    AIRFLOW__CELERY__WORKER_AUTOSCALE: 8,2

    # Additional packages installed into the Airflow containers at startup.
    # Defined here directly (no .env indirection) so the pip manifest travels
    # with the compose file — `_PIP_ADDITIONAL_REQUIREMENTS` in a user's .env
    # would shadow and drift from this list otherwise.
    # NOTE: soda-core runs in a separate container due to opentelemetry conflict.
    _PIP_ADDITIONAL_REQUIREMENTS: "boto3 apache-airflow-providers-celery redis astronomer-cosmos dbt-postgres dbt-duckdb duckdb"

    # MinIO/S3 configuration for DAGs
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

    # PostgreSQL for data warehouse (separate from Airflow metadata)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: airflow
    POSTGRES_PASSWORD: airflow
    POSTGRES_DB: airflow

    # ==========================================================================
    # External API Keys
    # ==========================================================================
    # IsThereAnyDeal API (https://isthereanydeal.com/dev/app/)
    ITAD_API_KEY: ${ITAD_API_KEY:-}

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
    - ${AIRFLOW_PROJ_DIR:-.}/soda:/opt/airflow/soda
    - ${AIRFLOW_PROJ_DIR:-.}/monitoring/grafana/dashboards:/opt/airflow/grafana-dashboards
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  # ===========================================================================
  # CORE INFRASTRUCTURE
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # PostgreSQL - Airflow Metadata + Data Warehouse
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
      - ${AIRFLOW_PROJ_DIR:-.}/sql/init:/docker-entrypoint-initdb.d
      - ${AIRFLOW_PROJ_DIR:-.}/backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Redis - Celery Message Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: airflow-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # MinIO - S3-Compatible Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: airflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - airflow-network

  # ===========================================================================
  # AIRFLOW SERVICES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Airflow API Server - Web UI & REST API (Airflow 3.x)
  # ---------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "9091:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow Scheduler - Task Scheduling & Orchestration
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow DAG Processor - DAG Parsing (Airflow 3.x)
  # ---------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow Triggerer - Deferrable Operators Support
  # ---------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow Celery Worker - Task Execution
  # ---------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow Init - Database Migration & User Creation
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config,scripts,dbt,soda}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config,scripts,dbt,soda}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Flower - Celery Monitoring (optional, use with --profile flower)
  # ---------------------------------------------------------------------------
  flower:
    <<: *airflow-common
    container_name: airflow-flower
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    networks:
      - airflow-network

  # ===========================================================================
  # OBSERVABILITY STACK
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # StatsD Exporter - Convert Airflow metrics to Prometheus format
  # ---------------------------------------------------------------------------
  statsd-exporter:
    image: prom/statsd-exporter:v0.27.2
    container_name: statsd-exporter
    command:
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
      - --statsd.mapping-config=/etc/statsd-exporter/mapping.yml
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/statsd-mapping.yml:/etc/statsd-exporter/mapping.yml:ro
    ports:
      - "9102:9102"
      - "9125:9125/udp"
    restart: always
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: always
    depends_on:
      - statsd-exporter
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # AlertManager - Alert Routing & Notifications
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Grafana - Visualization & Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Allow access from any host (not just localhost)
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'false'
      # Enable public dashboards (Grafana 9+)
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      # SECURITY: Anonymous access controlled via environment variable
      # Set GRAFANA_ANONYMOUS_ENABLED=false in production!
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Security settings for external access
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_SECURITY_COOKIE_SAMESITE: 'lax'
      GF_SECURITY_COOKIE_SECURE: 'false'
      # Unified Alerting (Grafana 9+) - enables SQL-based alert rules
      GF_UNIFIED_ALERTING_ENABLED: 'true'
      GF_ALERTING_ENABLED: 'false'
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${AIRFLOW_PROJ_DIR:-.}/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: always
    depends_on:
      - prometheus
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Airflow CLI - Debug/Admin Access (optional, use with --profile debug)
  # ---------------------------------------------------------------------------
  airflow-cli:
    <<: *airflow-common
    container_name: airflow-cli
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    networks:
      - airflow-network

  # ===========================================================================
  # WEB AUTOMATION
  # ===========================================================================

  # ===========================================================================
  # DATA QUALITY TOOLS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Soda Core - Data Quality Scanning (isolated due to dependency conflicts)
  # Usage: docker compose run --rm soda scan -d postgres soda/checks/
  # ---------------------------------------------------------------------------
  soda:
    image: sodadata/soda-core:v3.3.22
    container_name: soda-core
    profiles:
      - soda
    working_dir: /workspace
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/soda:/workspace/soda:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    entrypoint: ["soda"]
    command: ["--help"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airflow-network

  # ===========================================================================
  # ADDITIONAL EXPORTERS (for full observability)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Redis Exporter - Metrics for Prometheus
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: redis-exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "9121:9121"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter - Metrics for Prometheus
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://airflow:${POSTGRES_PASSWORD:-airflow}@postgres:5432/airflow?sslmode=disable
    ports:
      - "9187:9187"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - airflow-network

  # ===========================================================================
  # WEBAPP (API + Frontend)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Datatouille API - FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: datatouille-api
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/1
      AIRFLOW_API_URL: http://airflow-apiserver:8080/api/v2
      AIRFLOW_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      API_KEY: ${DATATOUILLE_API_KEY:-dev-local-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - airflow-network

  # ---------------------------------------------------------------------------
  # Datatouille Frontend - Next.js 15
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: datatouille-frontend
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    depends_on:
      - api
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - airflow-network

  # ===========================================================================
  # WORKFLOW AUTOMATION
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # n8n - Workflow Automation Platform
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=0.0.0.0
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - airflow-network

networks:
  airflow-network:
    driver: bridge

volumes:
  postgres-db-volume:
  redis-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  n8n-data:
