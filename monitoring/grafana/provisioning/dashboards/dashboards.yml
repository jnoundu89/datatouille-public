apiVersion: 1

providers:
  - name: 'platform'
    orgId: 1
    folder: 'Platform'
    folderUid: 'platform'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/platform

  - name: 'other'
    orgId: 1
    folder: 'Other'
    folderUid: 'other-sources'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/other
