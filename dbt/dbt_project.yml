# =============================================================================
# dbt Project Configuration - Ingestion Platform (Public Test Version)
# =============================================================================
name: 'ingestion_platform'
version: '1.0.0'
config-version: 2

profile: 'ingestion_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  ingestion_platform:
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
      domain_meteo:
        meteo:
          +tags: ['staging', 'meteo']
      domain_retail:
        toscrape:
          +tags: ['staging', 'toscrape']

    marts:
      +materialized: table
      +schema: gold
      +tags: ['marts', 'gold']
      domain_meteo:
        meteo:
          +tags: ['marts', 'meteo']
      domain_retail:
        toscrape:
          +tags: ['marts', 'toscrape']

tests:
  ingestion_platform:
    +severity: warn

vars:
  start_date: '2024-01-01'
  env: "{{ env_var('DBT_ENV', 'dev') }}"
